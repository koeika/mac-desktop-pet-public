<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Whisky&Cling 生词收藏</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><img src="icon.png" alt="" width="42" height="42"><div><h1>Whisky&Cling</h1><span>收藏生词</span></div></header>
<details id="pairing"><summary>桌宠配对</summary><label>服务地址<input id="endpoint" value="http://127.0.0.1:4789" autocomplete="off"></label><label>配对码<input id="token" type="password" autocomplete="off"></label><button id="save-config" type="button">保存配对</button></details>
<form id="capture-form">
<div class="row"><label>单词 / 短语<input id="term" required maxlength="120"></label><label>语言<select id="language"><option value="en">英语</option><option value="ja">日语</option><option value="other">其他</option></select></label></div>
<div class="row"><label>UK 音标 / 日语读音<input id="phoneticUK"></label><label>US 音标<input id="phoneticUS"></label></div>
<label>释义 / 词性<textarea id="meaning" rows="2" maxlength="8000"></textarea></label>
<label>原文例句<textarea id="example" rows="3" maxlength="8000"></textarea></label>
<label>例句翻译<textarea id="exampleTranslation" rows="2" maxlength="8000"></textarea></label>
<label>语境说明<textarea id="hint" rows="2" maxlength="8000"></textarea></label>
<label>来源网页<input id="sourceURL" type="url"></label><label>网页标题<input id="sourceTitle"></label>
<details><summary>粘贴沉浸式翻译词条</summary><textarea id="copied" rows="4" placeholder="复制词条后粘贴到这里"></textarea><button id="parse" type="button">提取音标和释义</button></details>
<button id="submit" class="primary" type="submit">加入桌宠词本</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<details id="queue"><summary id="pending-title">待发送 0 条</summary><button id="retry" type="button">立即重试</button><div id="pending-items"></div></details>
</main><script src="capture.js" type="module"></script></body></html>
