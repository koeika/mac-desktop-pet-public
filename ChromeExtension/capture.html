<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whisky&Cling 生词收藏</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><img src="icon.png" alt="" width="34" height="34"><h1>Whisky & Cling</h1><span id="connection">生词本</span></header>
<form id="lookup-form"><input id="term" aria-label="查询单词" placeholder="单词或短语" required maxlength="120" autocomplete="off"><button class="primary" id="lookup" type="submit">查询</button></form>
<article id="result" hidden><h2 id="word-title"></h2><p class="phonetic" id="phonetic"></p><p class="meaning" id="meaning"></p><blockquote><span id="example"></span><span class="translation" id="translation"></span></blockquote><p class="hint" id="hint"></p><button id="submit" class="primary" type="button">收藏到桌宠</button></article>
<p id="status" role="status" aria-live="polite"></p>
<details id="pairing"><summary>桌宠配对与自动补全</summary><label>本地服务<input id="endpoint" value="http://127.0.0.1:4789" autocomplete="off"></label><label>配对码<input id="token" type="password" autocomplete="off"></label><label class="check"><input id="cloud" type="checkbox">缺项时用 DeepSeek 自动补全</label><p class="privacy">开启后，点击查询只发送单词、释义和当前句子。Key 留在 Mac，不读取整页，不传来源网址。</p><button id="save-config" type="button">保存配对</button></details>
<details><summary>粘贴已有词条</summary><textarea id="copied" rows="3" aria-label="已有词条"></textarea><button id="parse" type="button">读取词条</button></details>
<details id="queue"><summary id="pending-title">待发送 0 条</summary><button id="retry" type="button">立即重试</button><div id="pending-items"></div></details>
</main><script src="capture.js" type="module"></script></body></html>
