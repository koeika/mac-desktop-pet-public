name: Regression
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run codex-pet-selftest
      - run: node --test ChromeExtension/tests/*.test.mjs
      - run: swift run PetPetKnows --self-test-notebook
      - run: swift run PetPetKnows --self-test-enrichment
